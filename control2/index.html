<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street 3x3 — Control Cancha 2</title>
<style>
:root{--l:#B6FF00;--b:#0B0B0B;--p:#151515;--line:#333;--muted:#999}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:#fff;font-family:Arial,sans-serif}
header{padding:15px 20px;border-bottom:2px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:10px}
header img{width:58px;height:58px;object-fit:contain}header b{font-size:20px}
main{max-width:1100px;margin:auto;padding:20px}.panel{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px}
h1{margin:0 0 5px}.muted{color:var(--muted);font-size:12px}
select,button{font:inherit}select{background:#202020;color:#fff;border:1px solid #444;border-radius:8px;padding:12px;min-width:280px}
button{background:#222;color:#fff;border:1px solid #444;border-radius:9px;padding:12px 15px;font-weight:900;cursor:pointer}
button:hover{border-color:var(--l);color:var(--l)}.primary{background:var(--l);color:#000;border-color:var(--l)}
.scoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scoreCard{text-align:center;background:#202020;border:1px solid var(--line);border-radius:13px;padding:18px}
.foulDot{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;margin:0 2px;font-size:18px;line-height:1;color:#666}
.foulDot.active{color:var(--l)}.foulDot.bonus{border-color:#fff}.foulDot.possession{font-weight:1000}
.foulLegend{margin-top:5px;font-size:10px;color:var(--muted)}.foulLegend b{color:#fff}
.name{font-size:25px;font-weight:900}.score{font-size:92px;color:var(--l);font-weight:1000;line-height:1;margin:12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.clock{font-size:72px;font-weight:1000;text-align:center;margin:15px 0;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.status{padding:8px 10px;border-radius:99px;background:#252925;color:#fff;font-size:11px;font-weight:900;display:inline-block}
.live{background:var(--l);color:#000}
@media(max-width:700px){.scoreGrid{grid-template-columns:1fr}.score{font-size:76px}.clock{font-size:58px}header{align-items:flex-start;flex-direction:column}select{width:100%;min-width:0}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:10px"><img src="../logo.png"><b><span style="color:var(--l)">STREET</span> 3x3 · CANCHA 2</b></div>
<button onclick="location.href='../marcador/'">← CENTRO DE MARCADORES</button>
</header>
<main>
<div class="panel">
<h1>Control · Cancha 2</h1>
<p class="muted">Elegí un partido del fixture. Los equipos salen automáticamente de los equipos inscriptos.</p>
<div class="row" style="justify-content:flex-start">
<select id="matchSelect" onchange="selectedMatchId=this.value"><option value="">Seleccionar partido</option></select>
<button class="primary" onclick="loadSelectedMatch()">CARGAR PARTIDO</button>
</div>
<div id="scheduled" class="muted" style="margin-top:10px"></div>
</div>
<div class="scoreGrid">
<div class="scoreCard">
<div class="name" id="hn">LOCAL</div><div class="score" id="hs">0</div><div>FALTAS <span id="hf"></span><div class="foulLegend">1–6 NORMAL · <b>7–9 BONUS</b> · <b>10 POSESIÓN</b></div></div>
<div class="row"><button onclick="score('home',1)">+1</button><button onclick="score('home',2)">+2</button><button onclick="score('home',3)">+3</button><button onclick="score('home',-1)">−1 CORREGIR</button></div>
<div class="row"><button onclick="foul('home',1)">FALTA +</button><button onclick="foul('home',-1)">FALTA −</button></div>
</div>
<div class="scoreCard">
<div class="name" id="an">VISITANTE</div><div class="score" id="as">0</div><div>FALTAS <span id="af"></span><div class="foulLegend">1–6 NORMAL · <b>7–9 BONUS</b> · <b>10 POSESIÓN</b></div></div>
<div class="row"><button onclick="score('away',1)">+1</button><button onclick="score('away',2)">+2</button><button onclick="score('away',3)">+3</button><button onclick="score('away',-1)">−1 CORREGIR</button></div>
<div class="row"><button onclick="foul('away',1)">FALTA +</button><button onclick="foul('away',-1)">FALTA −</button></div>
</div>
</div>
<div class="panel" style="text-align:center">
<div id="stateBadge" class="status">SIN PARTIDO</div>
<div class="clock" id="cl">10:00</div>
<div class="actions">
<button class="primary" id="cb" onclick="clockToggle()">INICIAR RELOJ</button>
<button id="otBtn" onclick="startOvertime()" style="display:none">🟡 INICIAR TIEMPO EXTRA</button>
<button id="suddenBtn" onclick="startSuddenDeath()" style="display:none">🔥 INICIAR MUERTE SÚBITA</button>
<button onclick="finishMatch()">FINALIZAR PARTIDO</button>
<button onclick="resetGame()">REINICIAR</button>
</div>
</div>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyA0IEk-UXbRP3ZxAKtj8xiQZIYQH3L2roI",authDomain:"street-3x3.firebaseapp.com",databaseURL:"https://street-3x3-default-rtdb.firebaseio.com",projectId:"street-3x3",storageBucket:"street-3x3.firebasestorage.app",messagingSenderId:"829695563143",appId:"1:829695563143:web:52424caaf4ade069592f22"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const ref=db.ref("match2");
const tournamentRef=db.ref("tournament");
let data={teams:{},matches:{}};
let selectedMatchId="";
let applyingAdminCorrection=false;
let lastAdminToken={};
let state={matchId:"",home:0,away:0,homeF:0,awayF:0,homeName:"LOCAL",awayName:"VISITANTE",remaining:600,running:false,endAt:null,finished:false,phase:"normal"};

tournamentRef.on("value",s=>{
  data=s.val()||{};data.teams=data.teams||{};data.matches=data.matches||{};
  renderMatchOptions();
  syncAdminCorrection();
});
ref.on("value",s=>{
  state=s.val()||{matchId:"",home:0,away:0,homeF:0,awayF:0,homeName:"LOCAL",awayName:"VISITANTE",remaining:600,running:false,endAt:null,finished:false,phase:"normal"};
  draw();
  if(!selectedMatchId) selectedMatchId=state.matchId||"";
  renderMatchOptions();
});
function team(id){return data.teams?.[id]?.name||"Por definir";}
  function isPlayoffId(id){
  return String(id).startsWith("playoff:");
}

function getFixture(id){
  if(isPlayoffId(id)){
    return data.playoffs?.[String(id).replace("playoff:","")]||null;
  }
  return data.matches?.[id]||null;
}

function fixtureRef(id){
  if(isPlayoffId(id)){
    return tournamentRef.child("playoffs").child(String(id).replace("playoff:",""));
  }
  return tournamentRef.child("matches").child(id);
}

function fixtureCourt(m){
  return String(m?.court||"");
}

function fixtureLabel(id){
  return ({
    qf1:"CUARTOS 1",
    qf2:"CUARTOS 2",
    qf3:"CUARTOS 3",
    qf4:"CUARTOS 4",
    sf1:"SEMIFINAL 1",
    sf2:"SEMIFINAL 2",
    final:"FINAL"
  }[id.replace("playoff:","")]||"PLAYOFF");
}
function hasScore(value){return value!==null&&value!==undefined&&value!==""&&Number.isFinite(Number(value));}
function hasFixtureResult(match){return hasScore(match?.homeScore)&&hasScore(match?.awayScore);}
function remaining(){return state.running&&state.endAt?Math.max(0,Math.ceil((Number(state.endAt)-Date.now())/1000)):Math.max(0,Number(state.remaining)||0);}
function dots(n){return Array.from({length:10},(_,i)=>{const active=i<n,zone=i<6?"normal":(i<9?"bonus":"possession");return `<span class="${active?"foulDot active "+zone:"foulDot "+zone}" title="${i+1}ª falta">${active?"●":"○"}</span>`;}).join("");}
function draw(){
  document.getElementById("hn").textContent=state.homeName||"LOCAL";
  document.getElementById("an").textContent=state.awayName||"VISITANTE";
  document.getElementById("hs").textContent=Number(state.home)||0;
  document.getElementById("as").textContent=Number(state.away)||0;
  document.getElementById("hf").innerHTML=dots(Number(state.homeF)||0);
  document.getElementById("af").innerHTML=dots(Number(state.awayF)||0);
  const t=remaining();
  document.getElementById("cl").textContent=state.phase==="sudden"?"—":String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  const cb=document.getElementById("cb");
  cb.textContent=state.running?"PAUSAR RELOJ":state.phase==="overtime"?"INICIAR RELOJ EXTRA":state.phase==="sudden"?"MUERTE SÚBITA":"INICIAR RELOJ";
  cb.disabled=!state.matchId||state.finished||state.phase==="sudden"||(!state.running&&t<=0);
  const tied=Number(state.home||0)===Number(state.away||0);
  document.getElementById("otBtn").style.display=state.matchId&&!state.finished&&state.phase==="normal"&&!state.running&&t===0&&tied?"inline-block":"none";
  document.getElementById("suddenBtn").style.display=state.matchId&&!state.finished&&state.phase==="overtime"&&!state.running&&t===0&&tied?"inline-block":"none";
  const badge=document.getElementById("stateBadge");
  if(!state.matchId)badge.textContent="SIN PARTIDO";
  else if(state.finished)badge.textContent="PARTIDO FINALIZADO";
  else if(state.phase==="sudden")badge.textContent="🔥 MUERTE SÚBITA · PRÓXIMA CANASTA GANA";
  else if(state.phase==="overtime")badge.textContent=state.running?"🟡 TIEMPO EXTRA · EN VIVO":"🟡 TIEMPO EXTRA";
  else badge.textContent=state.running?"🟡 EN VIVO":"⚪ PARTIDO CARGADO";
  badge.className="status "+(state.running?"live":"");
}

function renderMatchOptions(){
  const select=document.getElementById("matchSelect");
  if(!select)return;
  const previous=selectedMatchId || select.value || "";
  const regular=Object.entries(data.matches||{})
    .filter(([id,m])=>String(m.court)==="2"&&m.home&&m.away)
    .map(([id,m])=>({id,m,label:""}));
  const playoffs=Object.entries(data.playoffs||{})
    .filter(([id,m])=>String(m.court)==="2"&&m.home&&m.away)
    .map(([id,m])=>({id:"playoff:"+id,m,label:fixtureLabel("playoff:"+id)}));
  const entries=[...regular,...playoffs].sort((a,b)=>{
    const da=(a.m.date||"9999-99-99")+" "+(a.m.time||"99:99");
    const db=(b.m.date||"9999-99-99")+" "+(b.m.time||"99:99");
    return da.localeCompare(db);
  });
  select.innerHTML='<option value="">Seleccionar partido</option>';
  entries.forEach(({id,m,label})=>{
    const option=document.createElement("option");
    option.value=id;
    option.textContent=(label?label+" · ":"")+(m.date||"Sin fecha")+" · "+(m.time||"Sin hora")+" · "+team(m.home)+" vs "+team(m.away)+(hasFixtureResult(m)||m.finished===true?" · FINALIZADO":"");
    select.appendChild(option);
  });
  select.value=entries.some(entry=>entry.id===previous)?previous:"";
  selectedMatchId=select.value;
  const current=state.matchId?getFixture(state.matchId):null;
  const label=state.matchId&&isPlayoffId(state.matchId)?fixtureLabel(state.matchId)+" · ":"";
  document.getElementById("scheduled").textContent=current?label+"Programado: "+(current.date||"")+" · "+(current.time||"")+" · Cancha 2":"";
}

function snapshotFromFixture(id,m){
  const final=hasFixtureResult(m),admin=!isPlayoffId(id)&&(m.adminResultOverride===true||m.resultSource==="admin");
  if(admin||final)return {matchId:id,home:final?Number(m.homeScore):0,away:final?Number(m.awayScore):0,homeF:0,awayF:0,homeName:team(m.home).toUpperCase(),awayName:team(m.away).toUpperCase(),remaining:final?0:600,running:false,endAt:null,finished:final,phase:"normal"};
  if(m.liveState&&typeof m.liveState==="object")return {...m.liveState,matchId:id,homeName:team(m.home).toUpperCase(),awayName:team(m.away).toUpperCase(),running:false,endAt:null};
  return {matchId:id,home:0,away:0,homeF:0,awayF:0,homeName:team(m.home).toUpperCase(),awayName:team(m.away).toUpperCase(),remaining:600,running:false,endAt:null,finished:false,phase:"normal"};
}

function loadSelectedMatch(){
  const id=document.getElementById("matchSelect").value;
  if(!id)return alert("Seleccioná un partido.");
  const m=getFixture(id);
  if(!m)return alert("No se encontró el partido en el fixture.");
  if(String(m.court)!=="2")return alert("Este partido no pertenece a la Cancha 2.");
  if(state.matchId===id){selectedMatchId=id;draw();return;}
  if(state.running&&!confirm("Hay un reloj en marcha. ¿Querés detenerlo y cambiar de partido?"))return;
  if(state.matchId){
    const oldState={...state,remaining:remaining(),running:false,endAt:null};
    fixtureRef(state.matchId).child("liveState").set(oldState);
  }
  selectedMatchId=id;
  ref.set(snapshotFromFixture(id,m));
}
function save(x){
  if(!state.matchId)return;
  state={...state,...x};
  ref.update(x);
}
function score(t,n){
  if(!state.matchId)return alert("Primero cargá un partido.");
  if(state.finished)return alert("El partido está finalizado. Reinicialo antes de seguir modificando el marcador.");
  save({[t]:Math.max(0,(Number(state[t])||0)+n)});
}
function foul(t,n){
  if(!state.matchId)return alert("Primero cargá un partido.");
  if(state.finished)return alert("El partido está finalizado. Reinicialo antes de seguir modificando el marcador.");
  save({[t+"F"]:Math.max(0,Math.min(10,(Number(state[t+"F"])||0)+n))});
}
function clockToggle(){
  if(!state.matchId)return alert("Primero cargá un partido.");
  if(state.finished)return alert("Este partido está finalizado. Para volver a jugarlo, usá REINICIAR.");
  if(state.phase==="sudden")return;
  const t=remaining();
  if(state.running)save({remaining:t,running:false,endAt:null});
  else if(t>0)save({remaining:t,running:true,endAt:Date.now()+t*1000});
}
function startOvertime(){
  if(!state.matchId||state.finished)return;
  if(state.phase!=="normal"||remaining()!==0)return;
  if(Number(state.home)!==Number(state.away))return alert("El tiempo extra solo corresponde si el partido terminó empatado.");
  save({phase:"overtime",remaining:120,running:false,endAt:null,finished:false});
}
function startSuddenDeath(){
  if(!state.matchId||state.finished)return;
  if(state.phase!=="overtime"||remaining()!==0)return;
  if(Number(state.home)!==Number(state.away))return alert("No hay muerte súbita porque ya hay un ganador.");
  save({phase:"sudden",remaining:0,running:false,endAt:null,finished:false});
}


function playoffProgressUpdates(id,winner,clear=false){
  const key=String(id).replace("playoff:","");
  const next={qf1:["sf1","home"],qf2:["sf1","away"],qf3:["sf2","home"],qf4:["sf2","away"],sf1:["final","home"],sf2:["final","away"]}[key];
  if(!next)return {};
  const [nextKey,slot]=next,base="tournament/playoffs/"+nextKey+"/",updates={};
  updates[base+slot]=clear?null:winner;
  if(clear){
    updates[base+"homeScore"]=null;updates[base+"awayScore"]=null;
    updates[base+"finished"]=false;updates[base+"status"]="Programado";updates[base+"liveState"]=null;
  }
  return updates;
}

function finishMatch(){
  if(!state.matchId)return;
  const playoff=isPlayoffId(state.matchId),finalHome=Number(state.home)||0,finalAway=Number(state.away)||0;
  if(playoff&&finalHome===finalAway)return alert("En playoffs no puede haber empate. Jugá el tiempo extra o la muerte súbita antes de finalizar.");
  if(!confirm("¿Finalizar este partido y guardar el resultado en el fixture?"))return;
  const id=state.matchId,finalState={...state,remaining:0,running:false,endAt:null,finished:true,home:finalHome,away:finalAway};
  state=finalState;ref.set(finalState);
  const prefix=playoff?"tournament/playoffs/"+String(id).replace("playoff:","")+"/":"tournament/matches/"+id+"/";
  const updates={};
  updates[prefix+"homeScore"]=finalHome;updates[prefix+"awayScore"]=finalAway;
  updates[prefix+"finished"]=true;updates[prefix+"status"]="Finalizado";
  updates[prefix+"resultSource"]="scoreboard";updates[prefix+"liveState"]=finalState;
  if(playoff){
    const fixture=getFixture(id),winner=finalHome>finalAway?fixture.home:fixture.away;
    Object.assign(updates,playoffProgressUpdates(id,winner,false));
  }else updates[prefix+"adminResultOverride"]=false;
  db.ref().update(updates);renderMatchOptions();draw();
}

function resetGame(){
  if(!state.matchId)return;
  if(!confirm("¿Reiniciar el marcador de este partido? Se borrarán sus puntos, faltas y resultado guardado."))return;
  const id=state.matchId,playoff=isPlayoffId(id);
  const resetState={matchId:id,home:0,away:0,homeF:0,awayF:0,homeName:state.homeName||"LOCAL",awayName:state.awayName||"VISITANTE",remaining:600,running:false,endAt:null,finished:false,phase:"normal"};
  state=resetState;ref.set(resetState);
  const prefix=playoff?"tournament/playoffs/"+String(id).replace("playoff:","")+"/":"tournament/matches/"+id+"/";
  const updates={};
  updates[prefix+"homeScore"]=null;updates[prefix+"awayScore"]=null;updates[prefix+"finished"]=false;
  updates[prefix+"status"]="Programado";updates[prefix+"resultSource"]="scoreboard";updates[prefix+"liveState"]=resetState;
  if(playoff)Object.assign(updates,playoffProgressUpdates(id,null,true));
  else updates[prefix+"adminResultOverride"]=false;
  db.ref().update(updates);renderMatchOptions();draw();
}
function syncAdminCorrection(){
  if(applyingAdminCorrection)return;
  const id=state.matchId;
  if(!id||isPlayoffId(id))return;
  const m=data.matches?.[id];
  if(!m || !(m.adminResultOverride===true || m.resultSource==="admin"))return;
  const token=[id,m.resultUpdatedAt??"",m.homeScore??"",m.awayScore??"",m.status??""].join("|");
  if(lastAdminToken[id]===token)return;
  const final=hasFixtureResult(m);
  const home=final?Number(m.homeScore):0;
  const away=final?Number(m.awayScore):0;
  if(Number(state.home)===home && Number(state.away)===away && state.finished===final){
    lastAdminToken[id]=token;
    return;
  }
  lastAdminToken[id]=token;
  const corrected={...state,home,away,remaining:final?0:600,running:false,endAt:null,finished:final,phase:"normal"};
  applyingAdminCorrection=true;
  state=corrected;
  ref.set(corrected).finally(()=>{applyingAdminCorrection=false;});
}
setInterval(()=>{
  if(state.running&&remaining()===0){
    state={...state,remaining:0,running:false,endAt:null};
    ref.update({remaining:0,running:false,endAt:null});
  }
  draw();
},250);
</script>
</body>
</html>
