
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street 3x3 — Cancha 2</title>

<style>
:root{
  --lime:#B6FF00;
  --black:#0B0B0B;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--black);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.screen{
  width:100vw;
  height:100vh;
  min-height:600px;
  display:grid;
  grid-template-rows:40% 60%;
  background:var(--black);
}

.header{
  display:flex;
  align-items:center;
  justify-content:center;
}

.header img{
  width:min(65vw,650px);
  height:38vh;
  object-fit:contain;
}

.main{
  display:grid;
  grid-template-columns:38% 24% 38%;
  align-items:center;
}

.team{
  text-align:center;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:translateY(-4vh);
}

.team-name{
  font-size:clamp(44px,5.2vw,100px);
  font-weight:1000;
  letter-spacing:2px;
  text-transform:uppercase;
  white-space:nowrap;
  max-width:95%;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  font-size:clamp(160px,19vw,350px);
  line-height:.78;
  font-weight:1000;
  color:var(--lime);
  font-variant-numeric:tabular-nums;
  margin-top:20px;
}

/* FALTAS: diseño original, sin modificaciones */
.fouls{
  margin-top:32px;
  display:flex;
  gap:9px;
  justify-content:center;
  align-items:center;
  flex-wrap:nowrap;
}

.dot{
  width:clamp(20px,1.7vw,34px);
  height:clamp(20px,1.7vw,34px);
  border:3px solid #fff;
  display:block;
  flex:0 0 auto;
}

.dot.on{
  background:var(--lime);
  border-color:var(--lime);
}

.dot.bonus{
  border-color:#FFD34D;
}

.dot.possession{
  border-color:#FF4545;
}

.dot.on.bonus{
  background:#FFD34D;
  border-color:#FFD34D;
}

.dot.on.possession{
  background:#FF4545;
  border-color:#FF4545;
}

.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  transform:translateY(-4vh);
}

.clock{
  font-size:clamp(80px,9.5vw,180px);
  font-weight:1000;
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:2px;
}

.court{
  color:var(--lime);
  font-size:clamp(22px,2.5vw,40px);
  font-weight:1000;
  letter-spacing:6px;
}

@media(max-width:800px){

  .screen{
    min-height:0;
    grid-template-rows:28% 72%;
  }

  .header img{
    width:min(65vw,300px);
    height:26vh;
  }

  .main{
    grid-template-columns:1fr 1fr;
    grid-template-rows:45% 55%;
  }

  .team{
    transform:translateY(-2vh);
  }

  .center{
    grid-column:1/3;
    grid-row:2;
    gap:12px;
    transform:none;
  }

  .team-name{
    font-size:clamp(26px,7vw,54px);
  }

  .score{
    font-size:clamp(100px,27vw,170px);
    margin-top:14px;
  }

  .fouls{
    margin-top:15px;
    gap:5px;
  }

  .dot{
    width:16px;
    height:16px;
    border-width:2px;
  }

  .clock{
    font-size:clamp(55px,14vw,90px);
  }

  .court{
    font-size:clamp(18px,5vw,27px);
    letter-spacing:4px;
  }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyA0IEk-UXbRP3ZxAKtj8xiQZIYQ3H1L2roI",
authDomain:"street-3x3.firebaseapp.com",
databaseURL:"https://street-3x3-default-rtdb.firebaseio.com",
projectId:"street-3x3",
storageBucket:"street-3x3.firebasestorage.app",
messagingSenderId:"829695563143",
appId:"1:829695563143:web:52424caaf4ade069592f22",
measurementId:"G-GYYX66VMFV"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const ref=db.ref("match2");

let state={
  home:0,
  away:0,
  homeF:0,
  awayF:0,
  homeName:"LOCAL",
  awayName:"VISITANTE",
  remaining:600,
  running:false,
  endAt:null,
  phase:"normal"
};

function remaining(){
  return state.running&&state.endAt
    ? Math.max(0,Math.ceil((Number(state.endAt)-Date.now())/1000))
    : Math.max(0,Number(state.remaining)||0);
}

function dots(n){
  return Array.from({length:10},(_,i)=>{
    const active=i<n;
    const zone=i<6?"normal":(i<9?"bonus":"possession");

    return '<span class="dot '+zone+(active?' on':'')+'"></span>';
  }).join("");
}

function draw(){
  document.getElementById("hn").textContent=state.homeName||"LOCAL";
  document.getElementById("an").textContent=state.awayName||"VISITANTE";

  document.getElementById("hs").textContent=state.home||0;
  document.getElementById("as").textContent=state.away||0;

  document.getElementById("hf").innerHTML=dots(Number(state.homeF)||0);
  document.getElementById("af").innerHTML=dots(Number(state.awayF)||0);

  if(state.phase==="sudden"){
    document.getElementById("clock").textContent="—";
  }else{
    const t=remaining();

    document.getElementById("clock").textContent=
      String(Math.floor(t/60)).padStart(2,"0")+":"+
      String(t%60).padStart(2,"0");
  }
}

ref.on("value",s=>{
  state=s.val()||state;
  draw();
});

setInterval(draw,250);
</script>
</head>

<body>
<div class="screen">

  <div class="header">
    <img src="../logo.png" alt="Street 3x3">
  </div>

  <div class="main">

    <div class="team">
      <div class="team-name" id="hn">LOCAL</div>
      <div class="score" id="hs">0</div>
      <div class="fouls" id="hf"></div>
    </div>

    <div class="center">
      <div class="clock" id="clock">10:00</div>
      <div class="court">CANCHA 2</div>
    </div>

    <div class="team">
      <div class="team-name" id="an">VISITANTE</div>
      <div class="score" id="as">0</div>
      <div class="fouls" id="af"></div>
    </div>

  </div>
</div>
</body>
</html>
