<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street 3x3 — Centro de Marcadores</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root{--lime:#B6FF00;--bg:#0B0B0B;--card:#151515;--line:#333;--muted:#999}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{border-bottom:2px solid var(--lime);padding:16px 22px;display:flex;align-items:center;gap:12px}
header img{width:58px;height:58px;object-fit:contain}header b{font-size:22px}
main{max-width:1100px;margin:auto;padding:22px}
h1{margin:0 0 7px;font-size:34px}p{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card.live{border-color:var(--lime)}
.card.paused{border-color:#777}
.card.finished{border-color:#444}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:900}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:22px 0;font-size:21px;font-weight:900}
.teams span:last-child{text-align:right}.score{color:var(--lime);font-size:24px}
.badge{padding:6px 9px;border-radius:99px;background:#252925;font-size:10px;color:#fff}
.live .badge{background:var(--lime);color:#000}
button{background:#222;color:#fff;border:1px solid #444;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer}
button:hover{border-color:var(--lime);color:var(--lime)}.primary{background:var(--lime);color:#000;border-color:var(--lime)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.next{margin-top:24px}.nextRow{display:grid;grid-template-columns:110px 1fr 100px;gap:12px;padding:13px 0;border-bottom:1px solid #2b2b2b;align-items:center}
.muted{color:var(--muted);font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.teams{font-size:17px}.nextRow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="../logo.png"><b><span style="color:var(--lime)">STREET</span> 3x3 · CENTRO DE MARCADORES</b></header>
<main>
<h1>Centro de Marcadores</h1>
<p>Elegí la cancha y entrá al control o al marcador público. Los partidos se toman del fixture de Admin.</p>
<div id="grid" class="grid"></div>
<div id="next" class="next"></div>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyA0IEk-UXbRP3ZxAKtj8xiQZIYQH3L2roI",authDomain:"street-3x3.firebaseapp.com",databaseURL:"https://street-3x3-default-rtdb.firebaseio.com",projectId:"street-3x3",storageBucket:"street-3x3.firebasestorage.app",messagingSenderId:"829695563143",appId:"1:829695563143:web:52424caaf4ade069592f22"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const tournamentRef=db.ref("tournament");
const liveRefs={1:db.ref("match"),2:db.ref("match2")};
let data={teams:{},matches:{}},live={1:null,2:null};

tournamentRef.on("value",s=>{
  data=s.val()||{};
  data.teams=data.teams||{};
  data.matches=data.matches||{};
  render();
});
liveRefs[1].on("value",s=>{live[1]=s.val();render();});
liveRefs[2].on("value",s=>{live[2]=s.val();render();});

function esc(x){
  return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function team(id){
  return data.teams?.[id]?.name||"Por definir";
}

function dt(m){
  if(!m.date||!m.time)return null;
  const d=new Date(m.date+"T"+m.time+":00-03:00");
  return isNaN(d)?null:d;
}

function currentMatch(court){
  const s=live[court];
  if(s?.matchId && data.matches[s.matchId]){
    return data.matches[s.matchId];
  }
  return null;
}

function matchStatus(s){
  if(!s?.matchId)return "DISPONIBLE";
  if(s.finished===true)return "FINALIZADO";
  if(s.running===true)return "EN VIVO";
  return "PAUSADO";
}

function nextForCourt(court){
  return Object.entries(data.matches||{})
    .filter(([id,m])=>
      String(m.court)===String(court) &&
      (m.homeScore==null||m.awayScore==null) &&
      id!==live[1]?.matchId &&
      id!==live[2]?.matchId
    )
    .map(([id,m])=>({id,m,d:dt(m)}))
    .filter(x=>x.d)
    .sort((a,b)=>a.d-b.d)[0];
}

function render(){
  const g=document.getElementById("grid");
  let h="";

  [1,2].forEach(court=>{
    const m=currentMatch(court);
    const s=live[court];
    const n=nextForCourt(court);
    const status=matchStatus(s);

    let cardClass="";
    if(status==="EN VIVO")cardClass="live";
    else if(status==="PAUSADO")cardClass="paused";
    else if(status==="FINALIZADO")cardClass="finished";

    let badge="";
    if(status==="EN VIVO")badge="🟡 EN VIVO";
    else if(status==="PAUSADO")badge="⏸ PAUSADO";
    else if(status==="FINALIZADO")badge="✓ FINALIZADO";
    else badge="⚪ DISPONIBLE";

    const homeName=m?team(m.home):(n?team(n.m.home):"Sin partido");
    const awayName=m?team(m.away):(n?team(n.m.away):"Sin partido");

    const score=m
      ?(Number(s.home)||0)+" — "+(Number(s.away)||0)
      :"VS";

    let description="";
    if(status==="EN VIVO")description="Partido en vivo";
    else if(status==="PAUSADO")description="Partido pausado";
    else if(status==="FINALIZADO")description="Partido finalizado";
    else if(n)description=(n.m.date||"")+" · "+(n.m.time||"")+" · próximo";
    else description="No hay partido asignado";

    h+=`<div class="card ${cardClass}">
      <div class="meta">
        <span>CANCHA ${court}</span>
        <span class="badge">${badge}</span>
      </div>
      <div class="teams">
        <span>${esc(homeName)}</span>
        <span class="score">${score}</span>
        <span>${esc(awayName)}</span>
      </div>
      <div class="muted">${esc(description)}</div>
      <div class="actions" style="margin-top:16px">
        <button class="primary" onclick="location.href='../control${court===2?'2':''}/'">🎛️ CONTROL CANCHA ${court}</button>
        <button onclick="location.href='../scoreboard${court===2?'2':''}/'">📺 MARCADOR</button>
      </div>
    </div>`;
  });

  g.innerHTML=h;

  let rows=Object.entries(data.matches||{})
    .filter(([id,m])=>
      (m.homeScore==null||m.awayScore==null) &&
      m.date &&
      m.time &&
      id!==live[1]?.matchId &&
      id!==live[2]?.matchId
    )
    .sort((a,b)=>
      (a[1].date+" "+a[1].time).localeCompare(b[1].date+" "+b[1].time)
    )
    .slice(0,8);

  document.getElementById("next").innerHTML=`
    <div class="card">
      <h2>Próximos partidos</h2>
      ${rows.length
        ?rows.map(([id,m])=>`
          <div class="nextRow">
            <b>Cancha ${esc(m.court||"—")}</b>
            <span>${esc(team(m.home))} vs ${esc(team(m.away))}</span>
            <span>${esc(m.date)} · ${esc(m.time)}</span>
          </div>
        `).join("")
        :"<p>No hay partidos programados.</p>"
      }
    </div>`;
}
</script>
</body>
</html>
